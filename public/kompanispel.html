<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kompanispel – Uppkoppling</title>
<style>
  :root{
    --bg:#0b1020; --panel:#111a33; --kant:#243052; --text:#e8eefc; --dim:#9fb1d4;
    --bla:#6cb2ff; --rod:#ff6b6b; --teams:#8b8cf0; --ok:#4caf50;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:20px 16px 8px;max-width:1200px;margin:0 auto}
  h1{margin:0 0 4px;font-size:24px}
  .under{color:var(--dim);font-size:14px;margin:0}
  nav{display:flex;gap:8px;padding:12px 16px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
  nav button{background:var(--panel);color:var(--text);border:1px solid var(--kant);border-radius:10px;
    padding:10px 18px;font-size:16px;font-weight:600;cursor:pointer}
  nav button[aria-selected="true"]{background:var(--bla);color:#071020;border-color:var(--bla)}
  main{max-width:1200px;margin:0 auto;padding:8px 16px 32px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .bg{background:var(--panel);border:1px solid var(--kant);border-top:8px solid var(--spel);border-radius:16px;padding:16px}
  .bg h2 .prick{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--spel);margin-right:8px;vertical-align:-1px}
  .bg h2{margin:0 0 2px;font-size:18px}
  .bg .info{color:var(--dim);font-size:13px;margin:0 0 14px}
  .roll{display:block;text-decoration:none;color:var(--text);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    border:1px solid var(--kant);background:#0e1730;border-left:6px solid var(--c);transition:transform .08s, background .15s}
  .roll:hover{background:#15214a;transform:translateY(-1px)}
  .roll b{display:block;font-size:17px}
  .roll span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
  .roll.saknas{opacity:.45;pointer-events:none}
  .t{--c:var(--teams)} .b{--c:var(--bla)} .r{--c:var(--rod)}
  details{max-width:1200px;margin:0 auto 32px;padding:0 16px;color:var(--dim)}
  details summary{cursor:pointer;font-size:14px}
  .gm{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .gm a{color:var(--text);background:var(--panel);border:1px solid var(--kant);border-radius:8px;padding:8px 12px;text-decoration:none;font-size:14px}
  .gm a:hover{border-color:var(--ok)}
</style>
</head>
<body>

<header>
  <h1>Kompanispel – välj din roll</h1>
  <p class="under">Välj din pluton, leta upp ditt spel (Blå, Gul eller Grön) och tryck på din befattning.</p>
</header>
<nav id="flikar" role="tablist"></nav>
<main id="innehall"></main>

<details>
  <summary>Spelledare (lärare) – öppna alla spel som GM</summary>
  <div class="gm" id="gmLankar"></div>
</details>

<script>
/* =========================================================
   KONFIGURATION – det enda du behöver ändra
   ========================================================= */
const KONFIG = {
  spelUrl: 'spel.html',            // relativt om sidan ligger i taktikspel/public
  plutoner: 6,
  // Spelen inom varje pluton. Spelkoden blir pluton.nummer (Blå = 1.1, Gul = 1.2, Grön = 1.3)
  spel: [
    { namn: 'Blå',  farg: '#4a90e2' },
    { namn: 'Gul',  farg: '#f2c94c' },
    { namn: 'Grön', farg: '#4caf50' }
  ],
  // Teams-länk (stridsledningsnät) per spel. Klistra in "Anslut"-länken från mötet.
  // Fler/färre plutoner: ändra 'plutoner' ovan och lägg till/ta bort rader här.
  // Samma länk får återanvändas för plutoner som inte spelar samtidigt.
  teams: {
    // 1. pluton
    '1.1': 'https://teams.microsoft.com/meet/3945744412526133?p=vEkOWuNu2c5bMvqGAN',   // Blå
    '1.2': 'https://teams.microsoft.com/meet/3329929403555723?p=x9BlvMLhjldQJQI1yF',   // Gul
    '1.3': 'https://teams.microsoft.com/meet/3633402577755880?p=i6nysoLoPKuYp1B4a8',   // Grön
    // 2. pluton
    '2.1': 'https://teams.microsoft.com/meet/3911939594900993?p=FDaYcYdU0erKSwuPLz',   // Blå
    '2.2': 'https://teams.microsoft.com/meet/3801567810654162?p=XTo5euDl4WLMFA0iQb',   // Gul
    '2.3': 'https://teams.microsoft.com/meet/3428422746751080?p=vYxskr4OTXFXd2GucT',   // Grön
    // 3. pluton
    '3.1': 'https://teams.microsoft.com/meet/3169858583947312?p=cH8chAbziWM4e3uhEZ',   // Blå
    '3.2': 'https://teams.microsoft.com/meet/3474590978426960?p=X2cGMhcPopC4crVOqM',   // Gul
    '3.3': 'https://teams.microsoft.com/meet/3480371876396678?p=rB0zO9SNA6tcqISoZ2',   // Grön
    // 4. pluton – samma möten som 1. pluton
    '4.1': 'https://teams.microsoft.com/meet/3945744412526133?p=vEkOWuNu2c5bMvqGAN',   // Blå
    '4.2': 'https://teams.microsoft.com/meet/3329929403555723?p=x9BlvMLhjldQJQI1yF',   // Gul
    '4.3': 'https://teams.microsoft.com/meet/3633402577755880?p=i6nysoLoPKuYp1B4a8',   // Grön
    // 5. pluton – samma möten som 2. pluton
    '5.1': 'https://teams.microsoft.com/meet/3911939594900993?p=FDaYcYdU0erKSwuPLz',   // Blå
    '5.2': 'https://teams.microsoft.com/meet/3801567810654162?p=XTo5euDl4WLMFA0iQb',   // Gul
    '5.3': 'https://teams.microsoft.com/meet/3428422746751080?p=vYxskr4OTXFXd2GucT',   // Grön
    // 6. pluton – samma möten som 3. pluton
    '6.1': 'https://teams.microsoft.com/meet/3169858583947312?p=cH8chAbziWM4e3uhEZ',   // Blå
    '6.2': 'https://teams.microsoft.com/meet/3474590978426960?p=X2cGMhcPopC4crVOqM',   // Gul
    '6.3': 'https://teams.microsoft.com/meet/3480371876396678?p=rB0zO9SNA6tcqISoZ2'    // Grön
  }
};
/* ========================================================= */

const kod = (p, b) => `${p}.${b}`;
const spelLank = (k, roll) => `${KONFIG.spelUrl}?kod=${encodeURIComponent(k)}&role=${roll}`;

function rollKnapp(klass, titel, text, href) {
  const a = document.createElement('a');
  a.className = 'roll ' + klass + (href ? '' : ' saknas');
  if (href) { a.href = href; a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML = `<b>${titel}</b><span>${href ? text : 'Länk saknas – kontakta lärare'}</span>`;
  return a;
}

function visaPluton(p) {
  document.querySelectorAll('#flikar button').forEach(btn =>
    btn.setAttribute('aria-selected', btn.dataset.p == p));
  try { localStorage.setItem('kompanispel-pluton', p); } catch (e) {}

  const main = document.getElementById('innehall');
  main.innerHTML = '';
  KONFIG.spel.forEach((spel, i) => {
    const k = kod(p, i + 1), teams = KONFIG.teams[k];
    const kort = document.createElement('section');
    kort.className = 'bg';
    kort.style.setProperty('--spel', spel.farg);
    kort.innerHTML = `<h2><span class="prick"></span>${p}. pluton – Spel ${spel.namn}</h2>
      <p class="info">Spelkod ${k}</p>`;
    kort.append(
      rollKnapp('t', 'Kompanichef', `Teams – stridsledningsnät ${spel.namn} ${k}. Leder via analog karta.`, teams),
      rollKnapp('t', 'Plutonchef',  `Teams – stridsledningsnät ${spel.namn} ${k}. Muntlig order till gruppchef.`, teams),
      rollKnapp('b', 'Gruppchef',   `Taktikspel – blå sida i Spel ${spel.namn} (${k})`, spelLank(k, 'blue')),
      rollKnapp('r', 'Fiende',      `Taktikspel – röd sida i Spel ${spel.namn} (${k})`, spelLank(k, 'red'))
    );
    main.append(kort);
  });
}

// Flikar + GM-länkar
const flikar = document.getElementById('flikar');
const gm = document.getElementById('gmLankar');
for (let p = 1; p <= KONFIG.plutoner; p++) {
  const btn = document.createElement('button');
  btn.textContent = `${p}. pluton`;
  btn.dataset.p = p;
  btn.setAttribute('role', 'tab');
  btn.onclick = () => visaPluton(p);
  flikar.append(btn);
  KONFIG.spel.forEach((spel, i) => {
    const a = document.createElement('a');
    a.href = spelLank(kod(p, i + 1), 'gm'); a.target = '_blank'; a.rel = 'noopener';
    a.textContent = `GM ${kod(p, i + 1)} ${spel.namn}`;
    a.style.borderLeft = `4px solid ${spel.farg}`;
    gm.append(a);
  });
}

// Startpluton: ?pluton=2 i länken (t.ex. från Moodle), annars senast valda, annars 1
let start = parseInt(new URLSearchParams(location.search).get('pluton'), 10);
if (!(start >= 1 && start <= KONFIG.plutoner)) {
  try { start = parseInt(localStorage.getItem('kompanispel-pluton'), 10); } catch (e) {}
}
visaPluton(start >= 1 && start <= KONFIG.plutoner ? start : 1);
</script>
</body>
</html>
